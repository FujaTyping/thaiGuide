<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThaiGuide - Offline</title>
    <style>
        body {
            font-family: fantasy;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .flex {
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: center;
            padding-bottom: 1.5rem;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .border-b {
            border-top: 0;
            border-left: 0;
            border-right: 0;
            border-bottom: #f7740a;
            border-bottom-width: 2px;
            border-style: solid;
        }

        .primary {
            color: #f7740a;
        }

        .text-center {
            text-align: center;
        }

        .vibrate-1 {
            animation: vibrate-1 .3s linear infinite both
        }

        .fixed {
            position: fixed;
            bottom: 0;
            padding-bottom: 5px;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-items: center;
            gap: 10px;
        }

        .rotate-center {
            animation: rotate-center 1s linear infinite both
        }

        @keyframes rotate-center {
            0% {
                transform: rotate(0)
            }

            100% {
                transform: rotate(360deg)
            }
        }

        @keyframes vibrate-1 {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }
    </style>
</head>
